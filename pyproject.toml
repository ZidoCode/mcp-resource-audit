[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-resource-audit"
version = "0.1.0"
description = "Offline audit of a recorded MCP session's resource, template, prompt, and capability surface. Zero dependencies."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "ZidoCode" }]
keywords = ["mcp", "model-context-protocol", "audit", "resources", "prompts", "capability-negotiation", "offline"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
mcp-resource-audit = "mcp_resource_audit:main"

[tool.hatch.build.targets.wheel]
only-include = ["mcp_resource_audit.py"]
sources = ["."]
